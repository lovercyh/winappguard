name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 创建 Release 需要写权限。
permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # 这一步同时完成构建和单文件打包。
      - name: 构建与发布
        run: powershell -ExecutionPolicy Bypass -File .\build\publish.ps1

      # 发布前先自检：审计不过就不发。
      # 审计是只读的，不需要管理员权限，所以能在 runner 上跑。
      - name: 发布前审计
        run: |
          dotnet build tools/SelfCheck/SelfCheck.csproj -c Debug
          dotnet run --project tools/SelfCheck/SelfCheck.csproj -c Debug --no-build -- --audit --no-pause

      # 生成发布说明，把校验和写进去 —— 用户可以用它确认下载没被篡改。
      #
      # 注意：模板刻意用**单引号** here-string（@'...'@）。
      # 因为说明里要放 markdown 的代码围栏（反引号），
      # 而 PowerShell 的双引号 here-string 会把反引号当转义符，把内容搞乱。
      # 单引号 here-string 不做任何转义，反引号可以原样写。
      # 需要插入的变量用占位符，最后再 Replace。
      - name: 生成发布说明
        shell: pwsh
        run: |
          $exe  = '.\dist\WinAppGuard.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          $tag  = '${{ github.ref_name }}'
          $version = $tag -replace '^v', ''

          # 从 CHANGELOG 里摘出当前版本的段落。
          # 版本号里的点号要转义，否则会被正则当成通配符。
          $changelog = Get-Content .\CHANGELOG.md -Raw -Encoding UTF8
          $section = ''
          $pattern = '(?ms)^##\s*\[?' + [regex]::Escape($version) + '\]?.*?(?=^##\s|\z)'
          $m = [regex]::Match($changelog, $pattern)
          if ($m.Success) { $section = $m.Value.Trim() }

          $template = @'
          ## 下载

          `WinAppGuard.exe` — 单文件自包含，约 __SIZE__ MB，目标机器无需安装 .NET。

          ### 校验和

          下载后可以这样确认文件没被篡改：

          ```powershell
          Get-FileHash .\WinAppGuard.exe -Algorithm SHA256
          ```

          应当得到：

          ```
          __HASH__
          ```

          ### 说明

          - exe **没有代码签名**，SmartScreen 首次运行会提示「未知发布者」，这是预期情况。
          - 程序需要**管理员权限**（它要创建防火墙规则和计划任务）。
          - 想核实这个二进制文件的能力，可以运行随附的自检工具：`WinAppGuard.SelfCheck.exe --audit`

          __CHANGELOG__
          '@

          $notes = $template.
              Replace('__SIZE__', "$size").
              Replace('__HASH__', $hash).
              Replace('__CHANGELOG__', $section)

          # 显式写成不带 BOM 的 UTF-8，避免 BOM 跑到发布说明开头变成一个怪字符。
          [System.IO.File]::WriteAllText(
              'release-notes.md', $notes, (New-Object System.Text.UTF8Encoding($false)))

          Write-Host "版本        = $version"
          Write-Host "SHA256      = $hash"
          Write-Host "大小        = $size MB"
          Write-Host "CHANGELOG 段落长度 = $($section.Length)"
          Write-Host '--- 发布说明预览（前 20 行）---'
          $notes -split "`n" | Select-Object -First 20 | ForEach-Object { Write-Host $_ }

      - name: 创建 Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/WinAppGuard.exe
          body_path: release-notes.md
          # 先发成草稿，让人工看一眼附件和说明再正式发布。
          draft: true
          generate_release_notes: false
