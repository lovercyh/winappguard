name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 这个项目只有 .NET 自带的依赖，不需要 secrets，权限给最小。
permissions:
  contents: read

jobs:
  build:
    name: 构建与审计
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 还原
        run: dotnet restore WinAppGuard.sln

      # 这个项目把警告当缺陷处理，所以这里用 -warnaserror 直接卡住。
      - name: 构建（Debug）
        run: dotnet build WinAppGuard.sln -c Debug --no-restore -warnaserror

      # ⚠️ 这一步刻意**不加** --no-restore，也不能只靠上面那次 restore。
      #
      # 原因：WinAppGuard.csproj 里的 RuntimeIdentifier（win-x64）写在
      # Condition="'$(Configuration)' == 'Release'" 里。
      # 上面那句 `dotnet restore` 没带 -c，是按 Debug 配置还原的 —— 那次还原里
      # 没有 win-x64 相关的资产。如果这里再写 --no-restore，就会报：
      #   NETSDK1047: Assets file ... doesn't have a target for 'net10.0-windows/win-x64'
      #
      # 加上 -c Release 让 dotnet build 自己按 Release 配置重新还原一次，问题就没了。
      - name: 构建（Release）
        run: dotnet build WinAppGuard.sln -c Release -warnaserror

      - name: 构建自检工具
        run: dotnet build tools/SelfCheck/SelfCheck.csproj -c Debug -warnaserror

      # 审计是纯只读的，刻意设计成不需要管理员权限，
      # 所以它能在 CI 里跑起来（runner 无法弹 UAC）。
      #
      # 它会检查：零第三方库、联网边界受控（网络类型全在预期清单内）、
      # P/Invoke 清单、没有注册表访问、没有绕过托管检查直接用网络 API。
      # 任意一项不符，进程会返回非零退出码，这一步就会失败。
      - name: 审计编译产物
        run: dotnet run --project tools/SelfCheck/SelfCheck.csproj -c Debug --no-build -- --audit --no-pause

      # 验证发布链路本身是通的（产出单文件 exe），但不发布。
      - name: 验证发布脚本
        run: powershell -ExecutionPolicy Bypass -File .\build\publish.ps1

      - name: 确认发布产物
        shell: pwsh
        run: |
          # 3.0 起 dist 固定是 4 个文件：界面 / 服务 / 安装器 / 卸载器。
          $expected = @(
            'WinAppGuard.exe',
            'WinAppGuardSvc.exe',
            'WinAppGuardSetup.exe',
            'WinAppGuardUninstall.exe'
          )

          $names = (Get-ChildItem .\dist -File).Name

          foreach ($name in $expected) {
            if ($names -notcontains $name) { throw "缺少发布文件：$name" }
          }

          $extra = $names | Where-Object { $expected -notcontains $_ }
          if ($extra) {
            throw "dist 里出现了预期之外的文件：$($extra -join ', ')"
          }

          # UI 仍然必须是单文件：publish 目录里除 exe/pdb 不应有别的文件。
          $uiExtra = Get-ChildItem .\build\_publish -File |
            Where-Object { $_.Name -ne 'WinAppGuard.exe' -and $_.Extension -ne '.pdb' }
          if ($uiExtra) {
            throw "UI 单文件打包未生效：$($uiExtra.Name -join ', ')"
          }

          # 安装器必须带内置载荷（末尾 magic WAGPAY01）。
          $stream = [System.IO.File]::OpenRead((Resolve-Path .\dist\WinAppGuardSetup.exe))
          try {
            $stream.Seek($stream.Length - 16, [System.IO.SeekOrigin]::Begin) | Out-Null
            $footer = New-Object byte[] 16
            $stream.Read($footer, 0, 16) | Out-Null
            $magic = [System.Text.Encoding]::ASCII.GetString($footer, 0, 8)
            if ($magic -ne 'WAGPAY01') { throw "安装器缺少内置载荷" }
          } finally {
            $stream.Dispose()
          }

          $setupMB = [math]::Round((Get-Item .\dist\WinAppGuardSetup.exe).Length / 1MB, 1)
          Write-Host "OK：4 个发布文件；Setup 内置载荷正常（$setupMB MB）"

      # 把产物传上去，方便手动下载来试
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: WinAppGuard-dev-build
          path: dist/WinAppGuard.exe
          retention-days: 14
