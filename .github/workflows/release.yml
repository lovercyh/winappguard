name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 创建 Release 需要写权限。
permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # 这一步同时完成构建和单文件打包。
      - name: 构建与发布
        run: powershell -ExecutionPolicy Bypass -File .\build\publish.ps1

      # 发布前先自检：审计不过就不发。
      # 审计是只读的，不需要管理员权限，所以能在 runner 上跑。
      - name: 发布前审计
        run: |
          dotnet build tools/SelfCheck/SelfCheck.csproj -c Debug
          dotnet run --project tools/SelfCheck/SelfCheck.csproj -c Debug --no-build -- --audit --no-pause

      # 生成发布说明，把校验和写进去 —— 用户可以用它确认下载没被篡改。
      #
      # 注意：模板刻意用**单引号** here-string（@'...'@）。
      # 因为说明里要放 markdown 的代码围栏（反引号），
      # 而 PowerShell 的双引号 here-string 会把反引号当转义符，把内容搞乱。
      # 单引号 here-string 不做任何转义，反引号可以原样写。
      # 需要插入的变量用占位符，最后再 Replace。
      - name: 生成发布说明
        shell: pwsh
        run: |
          $setup    = '.\dist\WinAppGuardSetup.exe'
          $uninst   = '.\dist\WinAppGuardUninstall.exe'
          $hash     = (Get-FileHash $setup  -Algorithm SHA256).Hash
          $usize    = [math]::Round((Get-Item $setup).Length / 1MB, 1)
          $uhash    = (Get-FileHash $uninst -Algorithm SHA256).Hash
          $uninstMB = [math]::Round((Get-Item $uninst).Length / 1MB, 1)
          $tag  = '${{ github.ref_name }}'
          $version = $tag -replace '^v', ''

          # 从 CHANGELOG 里摘出当前版本的段落。
          # 版本号里的点号要转义，否则会被正则当成通配符。
          $changelog = Get-Content .\CHANGELOG.md -Raw -Encoding UTF8
          $section = ''
          $pattern = '(?ms)^##\s*\[?' + [regex]::Escape($version) + '\]?.*?(?=^##\s|\z)'
          $m = [regex]::Match($changelog, $pattern)
          if ($m.Success) { $section = $m.Value.Trim() }

          $template = @'
          ## 下载（只需要两个文件）

          | 文件 | 用途 |
          |---|---|
          | `WinAppGuardSetup.exe` | 安装 / 修复（**已内置界面与服务**） |
          | `WinAppGuardUninstall.exe` | 完整卸载 |

          > ⚠️ **不要**单独下载或运行 `WinAppGuard.exe` / `WinAppGuardSvc.exe`。
          > 它们已经打包在 Setup 里：前者只是界面、后者只是服务；
          > 没有安装器就不会注册服务、不会创建快捷方式，单独下载**不起作用**。

          安装器约 __SIZE__ MB（内含界面 + 服务 + 卸载器）；卸载器约 __UNINST__ MB。

          ### 校验和

          下载后可以这样确认文件没被篡改：

          ```powershell
          Get-FileHash .\WinAppGuardSetup.exe -Algorithm SHA256
          Get-FileHash .\WinAppGuardUninstall.exe -Algorithm SHA256
          ```

          应当得到：

          ```
          WinAppGuardSetup.exe      __HASH__
          WinAppGuardUninstall.exe  __UHASH__
          ```

          ### 说明

          - exe **没有代码签名**，SmartScreen 首次运行会提示「未知发布者」，这是预期情况。
          - 安装器需要管理员权限；安装后的界面以普通权限运行，改规则时才弹一次 UAC。
          - 源码公开；想核实能力可以自行构建并运行 `WinAppGuard.SelfCheck.exe --audit`。

          __CHANGELOG__
          '@

          $notes = $template.
              Replace('__SIZE__', "$usize").
              Replace('__UNINST__', "$uninstMB").
              Replace('__HASH__', $hash).
              Replace('__UHASH__', $uhash).
              Replace('__CHANGELOG__', $section)

          # 显式写成不带 BOM 的 UTF-8，避免 BOM 跑到发布说明开头变成一个怪字符。
          [System.IO.File]::WriteAllText(
              'release-notes.md', $notes, (New-Object System.Text.UTF8Encoding($false)))

          Write-Host "版本        = $version"
          Write-Host "Setup SHA256     = $hash"
          Write-Host "Setup 大小       = $usize MB"
          Write-Host "Uninstall SHA256 = $uhash"
          Write-Host "Uninstall 大小   = $uninstMB MB"
          Write-Host "CHANGELOG 段落长度 = $($section.Length)"
          Write-Host '--- 发布说明预览（前 20 行）---'
          $notes -split "`n" | Select-Object -First 20 | ForEach-Object { Write-Host $_ }

      - name: 创建 Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/WinAppGuardSetup.exe
            dist/WinAppGuardUninstall.exe
          body_path: release-notes.md
          # 先发成草稿，让人工看一眼附件和说明再正式发布。
          draft: true
          generate_release_notes: false
